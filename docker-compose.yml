# ---------------------------------------------------------------------------
# Despliegue del agente en Coolify (patrón identical al del mailserver).
#
# Coolify -> Projects -> New Resource -> Docker Compose Empty -> pegar este
# archivo -> Environment Variables -> DOMINIO, MINIMAX_API_KEY, LLM_PROVIDER.
#
# POR QUE ESTE ARCHIVO Y NO SOLO EL Dockerfile:
# el servicio de correo que ya tenes funcionando declara a mano los labels de
# Traefik (rule, tls, certresolver) y se cuelga de la red `coolify`. Ese mismo
# patron es el que se replica aqui, para no depender de los labels que Coolify
# autogenera en el recurso tipo "Dockerfile".
#
# DONDE PEGAR LA CREDENCIAL (nunca en este archivo):
#   - Coolify: Environment Variables de este recurso -> MINIMAX_API_KEY
#   - Local: en un `.env` al lado (chmod 600; esta en .gitignore y .dockerignore)
#
# La clave llega en runtime: no se hornea en la imagen ni viaja en el repo.
# (Una clave escrita en el Dockerfile queda en las capas de la imagen y se lee
# con `docker history`.)
# ---------------------------------------------------------------------------

services:
  agente:
    build:
      context: .
      dockerfile: Dockerfile
    image: reto-01-registro-proveedor:latest
    container_name: reto-01-agente
    restart: unless-stopped

    environment:
      # La credencial del plan M. Llega desde Coolify (Environment Variables)
      # o desde el `.env` local. Nunca se escribe en este archivo.
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-minimax}"
      LLM_MODEL_MINIMAX: "${LLM_MODEL_MINIMAX:-MiniMax-M3.1-Flash}"
      HOST: "0.0.0.0"
      PORT: "3000"
      MAX_ITERACIONES: "${MAX_ITERACIONES:-25}"
      MAX_TOKENS_SESION: "${MAX_TOKENS_SESION:-120000}"
      FECHA_EJECUCION: "${FECHA_EJECUCION:-}"

    # Patron de Traefik identico al del mailserver que ya te funciona.
    labels:
      - traefik.enable=true
      - traefik.http.routers.reto01.rule=Host(`${DOMINIO:-zl17t2tqyifz1ylorbog3vld9.electrondevnaml.dev}`)
      - traefik.http.routers.reto01.tls=true
      - traefik.http.routers.reto01.tls.certresolver=letsencrypt
      - traefik.http.services.reto01.loadbalancer.server.port=3000
      - coolify.managed=true

    # Puerto publicado en el host: sirve como via directa de depuracion
    # (http://<IP>:3000). Para exponerlo fuera hace falta abrirlo en el
    # firewall: `ufw allow 3000/tcp`.
    ports:
      - "3000:3000"

    networks:
      - coolify

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  coolify:
    external: true
